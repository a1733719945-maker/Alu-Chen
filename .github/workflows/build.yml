name: 测试并打包

on:
  push:
    paths:
      - 'game/**'
      - 'server/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 中继服务器测试
        working-directory: server
        run: |
          npm ci
          npm test

      - name: 缓存 Godot 和导出模板
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-win-linux-android-mac

      - name: 下载 Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o g.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q g.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm g.zip
          curl -sSL -o t.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          unzip -q -j t.tpz templates/version.txt \
            templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe \
            templates/linux_release.x86_64 templates/linux_debug.x86_64 \
            templates/android_release.apk templates/android_debug.apk \
            templates/macos.zip -d "$T"
          rm t.tpz

      - name: 导入资源
        run: ~/godot/godot --headless --path game --import

      - name: 自动测试 · 单人（物理、抓魂兽、暗器铺、压枪、魂环、五章 Boss 和坐船）
        run: ~/godot/godot --headless --path game -- --autotest=solo

      - name: 自动测试 · 联机（房主 + 客人）
        run: |
          (cd server && PORT=18931 node server.js > /tmp/relay.log 2>&1 &)
          sleep 1
          ~/godot/godot --headless --path game -- --autotest=host --server=ws://127.0.0.1:18931 --room=TEST > /tmp/host.log 2>&1 &
          HOST=$!
          sleep 4
          ~/godot/godot --headless --path game -- --autotest=client --server=ws://127.0.0.1:18931 --room=TEST
          wait $HOST || (cat /tmp/host.log; exit 1)
          cat /tmp/host.log

      - name: 打包 Windows 版
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path game --export-release "Windows" ../build/windows/DouluoHunter.exe
          test -s build/windows/DouluoHunter.exe
          cp docs/玩家说明.txt build/windows/
          cd build && zip -r -q DouluoHunter-Windows.zip windows

      - name: 打包安卓版（APK）
        env:
          # 签名用仓库里固定的密钥：每次打出来的签名一样，手机上才能直接覆盖安装（不用卸载、存档不丢）
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/tools/android/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: cangxu
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: cangxu-friends
        run: |
          # 编辑器设置里写上安卓 SDK 和 JDK 17 的路径（GitHub 的机器自带）
          S=~/.config/godot/editor_settings-4.7.tres
          test -f "$S"
          for kv in "export/android/android_sdk_path|$ANDROID_HOME" "export/android/java_sdk_path|$JAVA_HOME_17_X64"; do
            k="${kv%%|*}"; v="${kv#*|}"
            if grep -q "^$k = " "$S"; then sed -i "s#^$k = .*#$k = \"$v\"#" "$S"; else echo "$k = \"$v\"" >> "$S"; fi
          done
          grep "export/android" "$S"
          # 版本号每次打包加一，手机上显示成"更新"
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" game/export_presets.cfg
          mkdir -p build/android
          ~/godot/godot --headless --path game --export-release "Android" ../build/android/CangxuHunter.apk
          test -s build/android/CangxuHunter.apk
          ls -la build/android

      - name: 打包 Mac 版（Intel + M 芯片通用，免费的 ad-hoc 签名，没有苹果公证）
        run: |
          mkdir -p build/mac
          ~/godot/godot --headless --path game --export-release "macOS" ../build/mac/CangxuHunter.zip
          test -s build/mac/CangxuHunter.zip
          cp docs/Mac第一次打开.txt build/mac/
          cd build/mac && zip -q CangxuHunter.zip Mac第一次打开.txt && mv CangxuHunter.zip ../CangxuHunter-Mac.zip
          unzip -l ../CangxuHunter-Mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: CangxuHunter-Mac
          path: build/CangxuHunter-Mac.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: DouluoHunter-Windows
          path: build/DouluoHunter-Windows.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: CangxuHunter-Android
          path: build/android/CangxuHunter.apk
          retention-days: 14

      - name: 发布到 Releases（每个分支一个最新测试版）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="latest-${GITHUB_REF_NAME//\//-}"
          gh release delete "$tag" --cleanup-tag -y || true
          gh release create "$tag" build/DouluoHunter-Windows.zip build/CangxuHunter-Mac.zip build/android/CangxuHunter.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "苍墟·猎灵 测试版（${GITHUB_SHA::7}）" \
            --notes "电脑：下载下面的 DouluoHunter-Windows.zip，解压后双击 DouluoHunter.exe。
          第一次运行时 Windows 可能提示“已保护你的电脑”：点“更多信息”→“仍要运行”。

          Mac：下载 CangxuHunter-Mac.zip，双击解压，把“苍墟·猎灵”拖进“应用程序”。Intel 和 M 芯片都能用（macOS 11 以上）。
          第一次打开被拦住（“无法验证开发者”）：系统设置 → 隐私与安全性 → 拉到最下面点“仍要打开”。
          提示“已损坏”：打开终端，输入 xattr -cr 加一个空格，把 app 拖进去，回车，再打开。详细见 zip 里的“Mac第一次打开.txt”。

          安卓手机：用手机浏览器打开这个页面，下载 CangxuHunter.apk，点开安装。
          第一次会提示“不允许安装未知来源的应用”：按提示允许浏览器（或文件管理器）安装应用，再点安装。
          以后更新直接下载新的 APK 覆盖安装，存档不会丢。Windows、Mac、手机可以一起联机。
          联机：一个人点“创建联机房间”，按 Esc 看房间码，发给朋友；朋友在主菜单输入房间码加入。

          分支：${GITHUB_REF_NAME}，提交：${GITHUB_SHA}"
